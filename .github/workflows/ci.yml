name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
            numpy: 'numpy==1.24.4'
          - os: ubuntu-latest
            python: '3.12'
            numpy: 'numpy>=2,<3'
          - os: windows-latest
            python: '3.12'
            numpy: 'numpy>=2,<3'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install declared dependency and package
        run: python -m pip install "${{ matrix.numpy }}" .
      - name: Test numerical, CLI and report contracts
        run: python -m unittest discover -s tests -v
      - name: Run both synthetic scenarios
        run: |
          python -m roundofflab demo --out artifacts/quiet
          python -m roundofflab demo --out artifacts/active --scenario active-outlier
      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*
  torch-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install CPU torch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install declared dependency and package
        run: python -m pip install "numpy>=2,<3" .
      - name: Run real export integration
        run: python -m unittest tests.test_integrations -v
