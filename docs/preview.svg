<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc"><title id="title">RoundoffLab: the same weights, two input conditions</title><desc id="desc">Measured output errors for two quantization policies on synthetic inputs. See the adjacent report for full data.</desc><rect width="1200" height="610" rx="16" fill="#edf3f8"/><style>text{font-family:Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,monospace}</style><text x="40" y="52" font-size="26" fill="#182e49" class="">RoundoffLab</text><text x="40" y="105" font-size="35" fill="#182e49" class="">The same weights. A different answer.</text><text x="40" y="142" font-size="16" fill="#52657a" class="">Weight-only fake quantization • synthetic example • float64 linear-layer reference</text><rect x="40" y="180" width="535" height="320" rx="10" fill="white" stroke="#d6e0e8"/><text x="64" y="218" font-size="23" fill="#182e49" class="">Outlier direction quiet</text><text x="64" y="250" font-size="13" fill="#52657a" class="mono">Policy                          Weight MSE     Output MSE</text><text x="64" y="304" font-size="19" fill="#246889" class="">Absmax / 4-bit</text><text x="320" y="304" font-size="19" fill="#182e49" class="mono">0.01953</text><text x="456" y="304" font-size="19" fill="#182e49" class="mono">1.183</text><text x="64" y="331" font-size="13" fill="#52657a" class="">Per-output-channel symmetric quantization</text><text x="64" y="397" font-size="19" fill="#b74b22" class="">Clip p95 / 4-bit</text><text x="320" y="397" font-size="19" fill="#182e49" class="mono">0.6179</text><text x="456" y="397" font-size="19" fill="#182e49" class="mono">0.01971</text><text x="64" y="424" font-size="13" fill="#52657a" class="">Per-output-channel symmetric quantization</text><text x="64" y="470" font-size="13" fill="#52657a" class="">Both columns are errors, not task accuracy.</text><rect x="625" y="180" width="535" height="320" rx="10" fill="white" stroke="#d6e0e8"/><text x="649" y="218" font-size="23" fill="#182e49" class="">Outlier direction active</text><text x="649" y="250" font-size="13" fill="#52657a" class="mono">Policy                          Weight MSE     Output MSE</text><text x="649" y="304" font-size="19" fill="#246889" class="">Absmax / 4-bit</text><text x="905" y="304" font-size="19" fill="#182e49" class="mono">0.01953</text><text x="1041" y="304" font-size="19" fill="#182e49" class="mono">1.183</text><text x="649" y="331" font-size="13" fill="#52657a" class="">Per-output-channel symmetric quantization</text><text x="649" y="397" font-size="19" fill="#b74b22" class="">Clip p95 / 4-bit</text><text x="905" y="397" font-size="19" fill="#182e49" class="mono">0.6179</text><text x="1041" y="397" font-size="19" fill="#182e49" class="mono">40.89</text><text x="649" y="424" font-size="13" fill="#52657a" class="">Per-output-channel symmetric quantization</text><text x="649" y="470" font-size="13" fill="#52657a" class="">Both columns are errors, not task accuracy.</text><text x="40" y="550" font-size="23" fill="#182e49" class="">Matrices in. Inspectable offline evidence out.</text><text x="40" y="583" font-size="14" fill="#52657a" class="">No GPU · No model conversion · No uploads · No speed or accuracy claims</text></svg>